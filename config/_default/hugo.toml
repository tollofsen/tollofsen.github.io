baseurl = "http://tollofsen.se"
title = "Jens' Blog"
locale = "en"
defaultcontentlanguage = "en"


[pagination]
pagerSize = 20

[services]
[services.disqus]
#shortname = "yourdiscussshortname"

[markup.highlight]
style = "onedark"

[params]
  author = "Jens Tollofsen"
  info = "Technology Connoisseur"
  description = "Jens Tollofsen's personal website"
  keywords = "blog,developer,personal"
  avatarurl = "img/avatar.webp"
  gravatar = "jens@tollofsen.se"

  # faviconSVG = "/img/favicon.svg"
  # favicon_32 = "/img/favicon-32x32.png"
  # favicon_16 = "/img/favicon-16x16.png"

  # since = 2019

  enableTwemoji = true

  colorScheme = "auto"
  hidecolorschemetoggle = false

  # customCSS = ["css/custom.css"]
  # customSCSS = ["scss/custom.scss"]
  # customJS = ["js/custom.js"]

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"

